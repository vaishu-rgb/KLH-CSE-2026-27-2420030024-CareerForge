services:
  postgres:
    image: postgres:17
    container_name: careerforge-postgres
    environment:
      POSTGRES_DB: careerforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vaishu25@S
    ports:
      - "5435:5432"
    volumes:
      - careerforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careerforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: careerforge-backend:latest
    container_name: careerforge-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerforge
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: vaishu25@S
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: careerforge-frontend:latest
    container_name: careerforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  careerforge-postgres-data: